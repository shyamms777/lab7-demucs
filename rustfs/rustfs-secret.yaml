#
# Credentials the rest and worker pods (namespace `default`) use to reach
# RustFS. Secrets are per-namespace, so this is a copy of the one in
# rustfs-deployment.yaml. Demo values only; never commit real credentials.
#
apiVersion: v1
kind: Secret
metadata:
  name: rustfs-creds
  namespace: default
type: Opaque
stringData:
  access_key: rustfs-lab-user
  secret_key: replace-this-demo-secret
