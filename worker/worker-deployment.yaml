apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1          # start with ONE: each worker needs several GB of RAM
  # Stop the old pod before starting its replacement, so an update never
  # needs memory for two DEMUCS workers on the node at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        # CHANGE ME: <your-dockerhub-user>/demucs-worker:<version>
        image: demucs-worker:v2
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: S3_HOST
          value: "rustfs:9000"   # RustFS object store
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef: {name: rustfs-creds, key: access_key}
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef: {name: rustfs-creds, key: secret_key}
        resources:
          # The scheduler only places this pod on a node with this much
          # free memory. If the pod uses more than `limits`, it is
          # OOMKilled -- check with `kubectl describe pod <name>`.
          requests:
            cpu: 1000m
            memory: 4Gi
          limits:
            memory: 7Gi
        volumeMounts:
        - name: models          # cache the ~80 MB-2.5 GB model download
          mountPath: /data/models
        - name: scratch
          mountPath: /tmp/demucs
      volumes:
      # emptyDir survives container restarts (but not pod deletion).
      # See TUTORIAL.md Level 6 for a PersistentVolumeClaim upgrade.
      - name: models
        emptyDir: {}
      - name: scratch
        emptyDir: {}
