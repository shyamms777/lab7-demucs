apiVersion: v1
kind: Service
metadata:
  name: rest-service
spec:
  type: NodePort   # required by the GKE (gce) Ingress; also works locally
  selector:
    app: rest
  ports:
  - protocol: TCP
    port: 5000        # port other things in the cluster connect to
    targetPort: 5000  # port the container actually listens on
